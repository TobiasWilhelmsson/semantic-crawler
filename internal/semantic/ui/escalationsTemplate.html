{{define "content"}}<div class="page-title"><div><h1>Escalations</h1><p class="muted">Candidates that need a domain expert or team lead.</p></div></div>{{if .Candidates}}<div class="table-wrap"><table><thead><tr><th>ID</th><th>Source</th><th>URL</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>{{range .Candidates}}<tr><td>#{{.ID}}</td><td>{{.SourceID}}</td><td>{{.URL}}</td><td><span class="{{statusClass .Status}}">{{.Status}}</span></td><td>{{formatTime .CreatedAt}}</td><td><a class="button warning" href="{{$.Base}}/review/{{.ID}}">Open review</a></td></tr>{{end}}</tbody></table></div>{{else}}<p class="empty">No escalated candidates.</p>{{end}}{{end}}
