{{define "content"}}<div class="page-title"><div><p class="eyebrow">SOURCE SETUP</p><h1>Add a website</h1><p class="muted">Define where to look and what to keep. Start with a small scan.</p></div><a class="button" href="/semantic/sources">Back to sources</a></div><section class="panel">{{if .Error}}<div class="error-summary" role="alert"><h2>Check the source settings</h2><p>{{.Error}}</p><a href="#seed-url">Check URL</a> · <a href="#source-scope">Check scope</a></div>{{end}}<form method="post" action="/semantic/sources/new"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><div class="form-grid"><div><label for="source-name">Source name</label><input id="source-name" name="name" required value="{{.Form.Name}}" placeholder="Product documentation"></div><div><label for="source-slug">Short name</label><input id="source-slug" name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" value="{{.Form.Slug}}" placeholder="product-docs"></div></div><label for="seed-url">Starting URL</label><input id="seed-url" type="url" name="seed_url" required value="{{.Form.SeedURL}}" placeholder="https://docs.example.test/guide/"><div class="form-grid"><div><label for="allowed-host">Allowed host</label><input id="allowed-host" name="allowed_host" value="{{.Form.AllowedHost}}" placeholder="Defaults to starting hostname"></div><div><label for="allowed-path">Allowed path</label><input id="allowed-path" name="allowed_path_prefix" value="{{.Form.AllowedPathPrefix}}" placeholder="Defaults to starting path"></div></div><label for="source-scope">What should the scan include?</label><textarea id="source-scope" name="scope" required placeholder="Include guides, tables and warnings. Exclude news and account pages.">{{.Form.Scope}}</textarea><details class="panel"><summary>Instructions and default limits</summary><div class="form-grid"><div><label for="default-pages">Default page limit</label><input id="default-pages" type="number" name="max_pages" min="1" max="1000" value="{{.Form.MaxPages}}" required></div><div><label for="default-depth">Default depth</label><input id="default-depth" type="number" name="max_depth" min="1" max="10" value="{{.Form.MaxDepth}}" required></div></div><label for="source-instructions">Extraction instructions</label><textarea id="source-instructions" name="skill_markdown" required>{{.Form.SkillMarkdown}}</textarea></details><button class="primary">Create source</button></form></section>{{end}}
