name: Bug report
description: Report a reproducible software problem using sanitized examples.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, environment files, database dumps, private prompts
        or sensitive captured pages. Report security issues privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Paste semantic-crawler -version output, or the source revision.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS ARM64, Ubuntu AMD64, etc.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Command and minimal reproduction
      description: Include sanitized steps, configuration and synthetic HTML if needed.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      description: Remove credentials, private URLs and personal information.
